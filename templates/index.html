<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Morse translator</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>

<h1 class="text-center mt-4">Morse code translator :</h1>


<div class="container">
    <div class="row">
        <div class="col-12">
            <h2 class="mt-3">Word to translate to morse</h2>

            <form action="/translate" method="POST">
            <input type="text" name="translate" placeholder="Code to translate">
            <button class="btn btn-success" type="submit">Code</button>
            </form>

            {% if code %}
            <p> {{ word.lower() }} : {{ code }} </p>
            {% endif %}
        </div>

        <div class="col-12 mt-5">
            <h2>Morse to translate to word</h2>
            <form action="/untranslate" method="POST">
            <input type="text" name="untranslate" placeholder="Code to translate">
            <button class="btn btn-success" type="submit">Decode</button>
            </form>

            {% if mot %}
            <p> {{ mot }} </p>
            {% endif %}
        </div>

    </div>
</div>


</body>
</html>
